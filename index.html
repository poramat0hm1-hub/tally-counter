<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tally Counter</title>
<meta name="theme-color" content="#17181A" />
<meta name="description" content="Field survey tally counter with synced world clock, intervals, and CSV export." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  html,body{margin:0; padding:0; background:#0e0f10;}
</style>
</head>
<body>
<style>
  :root{
    --asphalt:#17181A; --panel:#212226; --panel-2:#2A2C31; --border:#3A3C42;
    --text:#F2F0EA; --muted:#9A9CA3; --orange:#FF6A13; --yellow:#F5C518;
    --green:#4CAF7D; --red:#E5484D; --mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;
    --disp:'Bahnschrift','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box;}
  .tc{background:var(--asphalt); color:var(--text); font-family:var(--disp);
    border-radius:16px; padding:20px; max-width:520px; margin:0 auto; min-height:420px; position:relative;}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); margin:0 0 2px;}
  .titlerow{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
  .title{font-size:20px; font-weight:700; margin:0;}
  .backbtn{background:transparent; border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:6px 10px; font-size:12px; cursor:pointer; font-family:var(--disp); flex-shrink:0;}
  .primary{background:var(--orange); border:1px solid var(--orange); color:#1a0c00; border-radius:8px;
    padding:12px 14px; font-size:13px; cursor:pointer; font-family:var(--disp); font-weight:700; width:100%;}
  .secondary{background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:10px 14px; font-size:12px; cursor:pointer; font-family:var(--disp); font-weight:700; width:100%;}
  .danger{background:transparent; border:1px solid var(--red); color:var(--red); border-radius:8px;
    padding:10px 14px; font-size:12px; cursor:pointer; font-family:var(--disp); font-weight:700; width:100%;}
  .surveycard{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .surveyname{font-size:15px; font-weight:700;}
  .surveymeta{font-size:11px; color:var(--muted); margin-top:2px;}
  .cardbtns{display:flex; gap:6px; flex-shrink:0;}
  .smallbtn{background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:6px 10px; font-size:12px; cursor:pointer; font-family:var(--disp);}
  .smallbtn.start{background:var(--orange); border-color:var(--orange); color:#1a0c00; font-weight:700;}
  .smallbtn.del{color:var(--red); border-color:var(--red);}
  .emptystate{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}
  .field{margin-bottom:12px;}
  .flabel{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px;}
  .field input[type=text], .field input[type=date]{width:100%; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:6px; padding:9px 10px; font-family:var(--disp); font-size:14px;}
  .catrow{display:flex; gap:6px; margin-bottom:8px;}
  .catrow input{flex:1;}
  .catrow button{background:transparent; border:1px solid var(--border); color:var(--red); border-radius:6px;
    padding:0 10px; cursor:pointer; font-size:14px;}
  .addcatbtn{background:transparent; border:1px dashed var(--border); color:var(--muted); border-radius:6px;
    padding:8px; width:100%; cursor:pointer; font-family:var(--disp); font-size:12px; margin-bottom:10px;}
  .presetgrid{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .presetchip{background:var(--panel-2); border:1px solid var(--border); color:var(--muted); border-radius:20px;
    padding:6px 12px; font-size:12px; cursor:pointer; font-family:var(--disp);}
  .presetchip.on{background:var(--orange); border-color:var(--orange); color:#1a0c00; font-weight:700;}
  .errtext{color:var(--red); font-size:11px; margin:-6px 0 10px;}
  .btnrow{display:flex; gap:8px;}
  .clockcard{background:#000; border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px;}
  .clock{font-family:var(--mono); font-size:26px; font-weight:700; letter-spacing:.03em; color:var(--yellow);}
  .zonerow select{width:100%; margin-top:6px; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:5px 8px; font-family:var(--disp); font-size:11px;}
  .wakerow{font-size:10px; color:var(--muted); margin-top:6px; display:flex; align-items:center; gap:5px;}
  .dot{width:6px; height:6px; border-radius:50%; display:inline-block;}
  .totalcard{background:var(--panel-2); border:1px solid var(--orange); border-radius:10px; padding:10px 14px;
    margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .totalcard .tlabel{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .totalcard .tnum{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--yellow);}
  .counterlist{margin-bottom:12px;}
  .counter{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .clabel{font-size:13px; flex:1; word-break:break-word;}
  .cnum{font-family:var(--mono); font-size:28px; font-weight:700; min-width:44px; text-align:center;}
  .cbtn{border-radius:8px; font-size:22px; cursor:pointer; border:1px solid var(--border);
    font-family:var(--disp); font-weight:700; background:var(--panel-2); color:var(--text);
    width:52px; height:52px; flex-shrink:0;}
  .cbtn.plus{background:var(--orange); border-color:var(--orange); color:#1a0c00;}
  .cbtn:active{transform:scale(.93);}
  .intervalcard{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px;}
  .intervalrow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .intervalrow select{flex:1; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family:var(--disp); font-size:12px;}
  .intervaltimer{font-family:var(--mono); font-size:20px; font-weight:700; color:var(--green); min-width:60px; text-align:right;}
  .feedcard{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:12px;
    max-height:110px; overflow-y:auto;}
  .feeditem{font-size:11px; color:var(--muted); font-family:var(--mono); padding:2px 0;}
  .historytable{width:100%; border-collapse:collapse; font-size:11px; margin-top:6px;}
  .historytable th{text-align:right; color:var(--muted); font-weight:400; padding:3px 2px; border-bottom:1px solid var(--border);}
  .historytable th:first-child,.historytable td:first-child{text-align:left;}
  .historytable td{text-align:right; padding:3px 2px; border-bottom:1px solid var(--border); font-family:var(--mono);}
  .metafield{margin-bottom:8px;}
  .metafield input{width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 9px; font-family:var(--disp); font-size:12px;}
  .locbtn{background:var(--panel-2); border:1px solid var(--border); color:var(--muted); border-radius:6px;
    padding:6px 10px; font-size:11px; cursor:pointer; font-family:var(--disp); width:100%; margin-bottom:8px;}
  .locstatus{font-size:10px; color:var(--muted); margin:-4px 0 8px;}
  .hidden{display:none;}
  .modalbg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
    z-index:50; border-radius:16px;}
  .modalbox{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; width:80%; max-width:340px;}
  .modaltext{font-size:13px; margin:0 0 14px; line-height:1.4;}
  .modalbtns{display:flex; gap:8px;}
</style>

<div class="tc" id="app">

  <div id="view-list">
    <div class="titlerow">
      <div><p class="eyebrow">field tool</p><p class="title">My surveys</p></div>
    </div>
    <div id="surveylist"></div>
    <button class="primary" id="newsurveybtn">+ New survey</button>
  </div>

  <div id="view-builder" class="hidden">
    <div class="titlerow">
      <div><p class="eyebrow">setup</p><p class="title">Build survey</p></div>
      <button class="backbtn" data-nav="list">Cancel</button>
    </div>
    <div class="field">
      <p class="flabel">Survey name</p>
      <input type="text" id="surveyname" placeholder="e.g. Intersection AM peak count" maxlength="40" />
    </div>
    <div class="field">
      <p class="flabel">Surveyor name</p>
      <input type="text" id="surveyorname" placeholder="Your name" maxlength="40" />
    </div>
    <div class="field">
      <p class="flabel">Standard vehicle categories (tap to add)</p>
      <div class="presetgrid" id="presetgrid"></div>
    </div>
    <div class="field">
      <p class="flabel">Counters to track</p>
      <div id="catrows"></div>
      <button class="addcatbtn" id="addcatbtn">+ Add custom counter</button>
      <div class="errtext hidden" id="catserr"></div>
    </div>
    <button class="primary" id="savestartbtn">Save and start counting</button>
  </div>

  <div id="view-counter" class="hidden">
    <div class="titlerow">
      <div><p class="eyebrow" id="sessionlabel">session</p><p class="title" id="sessiontitle">Survey</p></div>
      <button class="backbtn" data-nav="list">Back</button>
    </div>

    <div class="clockcard">
      <div class="clock" id="clock">00:00:00</div>
      <div class="zonerow">
        <select id="zoneselect">
          <option value="Asia/Bangkok">Bangkok (ICT)</option>
          <option value="local">Device local time</option>
          <option value="UTC">UTC</option>
          <option value="Asia/Tokyo">Tokyo (JST)</option>
          <option value="Asia/Singapore">Singapore (SGT)</option>
          <option value="Europe/London">London (GMT/BST)</option>
          <option value="America/New_York">New York (ET)</option>
          <option value="America/Los_Angeles">Los Angeles (PT)</option>
          <option value="Australia/Sydney">Sydney (AEST)</option>
        </select>
      </div>
      <div class="wakerow"><span class="dot" id="wakedot" style="background:var(--muted)"></span><span id="wakestatus">Screen lock: checking…</span></div>
    </div>

    <button class="locbtn" id="captureloc">📍 Capture GPS location</button>
    <div class="locstatus" id="locstatus">No location captured yet</div>
    <div class="metafield">
      <input type="text" id="weathernotes" placeholder="Weather / conditions note (optional)" maxlength="80" />
    </div>

    <div class="totalcard">
      <span class="tlabel">Total (this interval)</span>
      <span class="tnum" id="totalnum">0</span>
    </div>

    <div class="counterlist" id="countergrid"></div>

    <div class="btnrow" style="margin-bottom:12px;">
      <button class="secondary" id="undobtn">↩ Undo last</button>
      <button class="danger" id="resetcounts">Reset counts</button>
    </div>

    <div class="intervalcard">
      <p class="flabel">Auto interval</p>
      <div class="intervalrow">
        <select id="intervallen">
          <option value="0">Off (manual only)</option>
          <option value="300">5 minutes</option>
          <option value="900" selected>15 minutes</option>
          <option value="1800">30 minutes</option>
          <option value="3600">60 minutes</option>
        </select>
        <span class="intervaltimer" id="intervaltimer">--:--</span>
      </div>
      <div class="btnrow">
        <button class="secondary" id="intervalstart">Start interval</button>
        <button class="secondary" id="intervallog">Log now</button>
      </div>
      <div id="historywrap"></div>
    </div>

    <div class="feedcard">
      <div class="flabel" style="margin-bottom:6px;">Recent activity</div>
      <div id="feedwrap"></div>
    </div>

    <div class="btnrow">
      <button class="secondary" id="exportraw">Export raw log CSV</button>
      <button class="secondary" id="exportsummary">Export interval CSV</button>
    </div>
  </div>

  <div class="modalbg hidden" id="modalbg">
    <div class="modalbox">
      <p class="modaltext" id="modaltext">Are you sure?</p>
      <div class="modalbtns">
        <button class="secondary" id="modalcancel">Cancel</button>
        <button class="danger" id="modalconfirm">Confirm</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  var TEMPLATES_KEY="survey_templates_v2";
  var SESSION_KEY_PREFIX="survey_session_v2_";
  var ZONE_KEY="tc_zone_pref";

  var PRESETS=["Motorcycle","Car (sedan)","Pickup","Truck 2-6 wheels","Large truck (>6 wheels)","Bus","Bicycle","Pedestrian"];

  var templates=JSON.parse(localStorage.getItem(TEMPLATES_KEY)||"null")||[];
  var nextTid=Math.max.apply(null,templates.map(function(t){return t.id;}).concat([0]))+1;
  var activeTemplateId=null;
  var wakeLock=null;
  var intervalHandle=null;

  function saveTemplates(){ localStorage.setItem(TEMPLATES_KEY,JSON.stringify(templates)); }
  function escapeHtml(s){ return s.replace(/[&<>"']/g,function(ch){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]; }); }

  // ---------- modal ----------
  var pendingConfirm=null;
  function askConfirm(msg,onYes){
    document.getElementById("modaltext").textContent=msg;
    pendingConfirm=onYes;
    document.getElementById("modalbg").classList.remove("hidden");
  }
  document.getElementById("modalcancel").addEventListener("click",function(){
    document.getElementById("modalbg").classList.add("hidden"); pendingConfirm=null;
  });
  document.getElementById("modalconfirm").addEventListener("click",function(){
    document.getElementById("modalbg").classList.add("hidden");
    if(pendingConfirm) pendingConfirm();
    pendingConfirm=null;
  });

  // ---------- feedback (sound / vibration) ----------
  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
  function beep(freq){
    try{
      var ctx=new (window.AudioContext||window.webkitAudioContext)();
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq||880; g.gain.value=0.05;
      o.start(); setTimeout(function(){ o.stop(); ctx.close(); },70);
    }catch(e){}
  }
  function tapFeedback(){ buzz(15); beep(880); }

  // ---------- wake lock ----------
  async function requestWakeLock(){
    var dot=document.getElementById("wakedot"), status=document.getElementById("wakestatus");
    try{
      if(!("wakeLock" in navigator)) throw new Error("unsupported");
      wakeLock=await navigator.wakeLock.request("screen");
      dot.style.background="var(--green)"; status.textContent="Screen lock: active";
      wakeLock.addEventListener("release",function(){
        dot.style.background="var(--muted)"; status.textContent="Screen lock: released";
      });
    }catch(e){
      dot.style.background="var(--muted)";
      status.textContent="Screen lock: unavailable in this preview (works once installed as an app)";
    }
  }
  function releaseWakeLock(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; } }

  // ---------- views ----------
  function showView(name){
    ["list","builder","counter"].forEach(function(v){
      document.getElementById("view-"+v).classList.toggle("hidden", v!==name);
    });
    if(name==="counter"){ requestWakeLock(); } else { releaseWakeLock(); if(intervalHandle){clearInterval(intervalHandle); intervalHandle=null;} }
  }
  document.querySelectorAll("[data-nav]").forEach(function(btn){
    btn.addEventListener("click",function(){ showView(btn.dataset.nav); renderList(); });
  });

  // ---------- list view ----------
  function renderList(){
    var wrap=document.getElementById("surveylist");
    if(templates.length===0){
      wrap.innerHTML='<div class="emptystate">No surveys yet.<br>Tap "New survey" to build your first counter set.</div>';
      return;
    }
    wrap.innerHTML="";
    templates.forEach(function(t){
      var card=document.createElement("div");
      card.className="surveycard";
      card.innerHTML='<div><div class="surveyname">'+escapeHtml(t.name)+'</div>'+
        '<div class="surveymeta">'+t.categories.length+' counters · '+escapeHtml(t.surveyorName||"—")+'</div></div>'+
        '<div class="cardbtns">'+
          '<button class="smallbtn start" data-start="'+t.id+'">Start</button>'+
          '<button class="smallbtn del" data-deltpl="'+t.id+'">Delete</button>'+
        '</div>';
      wrap.appendChild(card);
    });
  }
  document.getElementById("surveylist").addEventListener("click",function(e){
    var start=e.target.closest("[data-start]");
    var del=e.target.closest("[data-deltpl]");
    if(start){ openCounter(parseInt(start.dataset.start,10)); }
    if(del){
      var tid=del.dataset.deltpl;
      var t=templates.find(function(x){return x.id==tid;});
      askConfirm('Delete survey "'+(t?t.name:"")+'"? This cannot be undone.',function(){
        templates=templates.filter(function(x){return x.id!=tid;});
        localStorage.removeItem(SESSION_KEY_PREFIX+tid);
        saveTemplates(); renderList();
      });
    }
  });

  // ---------- builder view ----------
  var selectedPresets=[];
  function renderPresetGrid(){
    var wrap=document.getElementById("presetgrid");
    wrap.innerHTML="";
    PRESETS.forEach(function(p){
      var chip=document.createElement("button");
      chip.type="button"; chip.className="presetchip"+(selectedPresets.indexOf(p)>=0?" on":"");
      chip.textContent=p; chip.dataset.preset=p;
      wrap.appendChild(chip);
    });
  }
  document.getElementById("presetgrid").addEventListener("click",function(e){
    var chip=e.target.closest(".presetchip");
    if(!chip) return;
    var p=chip.dataset.preset;
    var idx=selectedPresets.indexOf(p);
    if(idx>=0){
      selectedPresets.splice(idx,1);
      Array.prototype.forEach.call(document.querySelectorAll("#catrows .catrow"),function(row){
        var input=row.querySelector("input");
        if(input.value===p) row.remove();
      });
    } else {
      selectedPresets.push(p);
      addCatRow(p);
    }
    renderPresetGrid();
  });

  function addCatRow(value){
    var row=document.createElement("div");
    row.className="catrow";
    row.innerHTML='<input type="text" placeholder="Counter name" maxlength="24" value="'+(value?escapeHtml(value):"")+'" />'+
      '<button type="button" aria-label="Remove">&times;</button>';
    row.querySelector("button").addEventListener("click",function(){ row.remove(); });
    document.getElementById("catrows").appendChild(row);
  }
  document.getElementById("addcatbtn").addEventListener("click",function(){ addCatRow(); });

  document.getElementById("newsurveybtn").addEventListener("click",function(){
    document.getElementById("surveyname").value="";
    document.getElementById("surveyorname").value="";
    document.getElementById("catserr").classList.add("hidden");
    selectedPresets=[];
    document.getElementById("catrows").innerHTML="";
    renderPresetGrid();
    showView("builder");
  });

  document.getElementById("savestartbtn").addEventListener("click",function(){
    var name=document.getElementById("surveyname").value.trim();
    var surveyor=document.getElementById("surveyorname").value.trim();
    var cats=Array.prototype.map.call(document.querySelectorAll("#catrows input"),function(i){return i.value.trim();})
      .filter(function(v){return v.length>0;});
    var errBox=document.getElementById("catserr");
    errBox.classList.add("hidden");
    if(!name){ document.getElementById("surveyname").focus(); return; }
    if(cats.length===0){ errBox.textContent="Add at least one counter."; errBox.classList.remove("hidden"); return; }
    var lower=cats.map(function(c){return c.toLowerCase();});
    var dupes=lower.filter(function(v,i){return lower.indexOf(v)!==i;});
    if(dupes.length>0){
      errBox.textContent='Duplicate counter name: "'+dupes[0]+'". Please rename it.';
      errBox.classList.remove("hidden");
      return;
    }
    var t={id:nextTid++, name:name, surveyorName:surveyor, categories:cats, createdAt:new Date().toISOString()};
    templates.push(t); saveTemplates();
    openCounter(t.id);
  });

  // ---------- session state ----------
  function getSession(tid){ return JSON.parse(localStorage.getItem(SESSION_KEY_PREFIX+tid)||"null"); }
  function saveSession(tid,s){ localStorage.setItem(SESSION_KEY_PREFIX+tid,JSON.stringify(s)); }

  function newSession(catCount){
    return { counts:new Array(catCount).fill(0), rawLog:[], intervalHistory:[], location:null, weather:"",
      intervalLen:900, intervalRemaining:900, intervalRunning:false };
  }

  function nowLabel(){
    var zone=localStorage.getItem(ZONE_KEY)||"Asia/Bangkok";
    var opts={hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false};
    if(zone!=="local"){ opts.timeZone=zone; }
    return new Intl.DateTimeFormat("en-GB",opts).format(new Date());
  }

  function openCounter(tid){
    var t=templates.find(function(x){return x.id===tid;});
    if(!t) return;
    activeTemplateId=tid;
    document.getElementById("sessiontitle").textContent=t.name;
    document.getElementById("sessionlabel").textContent="surveyor: "+(t.surveyorName||"—");
    var s=getSession(tid);
    if(!s || s.counts.length!==t.categories.length){ s=newSession(t.categories.length); saveSession(tid,s); }
    document.getElementById("weathernotes").value=s.weather||"";
    document.getElementById("intervallen").value=String(s.intervalLen||900);
    updateLocStatus(s);
    renderCounterList(t,s);
    renderTotal(s);
    renderFeed(s);
    renderHistory(s);
    renderIntervalTimer(s);
    var zonesel=document.getElementById("zoneselect");
    zonesel.value=localStorage.getItem(ZONE_KEY)||"Asia/Bangkok";
    showView("counter");
  }

  function renderTotal(s){
    document.getElementById("totalnum").textContent=s.counts.reduce(function(a,b){return a+b;},0);
  }

  function renderCounterList(t,s){
    var grid=document.getElementById("countergrid");
    grid.innerHTML="";
    t.categories.forEach(function(cat,idx){
      var box=document.createElement("div");
      box.className="counter";
      box.innerHTML='<div class="clabel">'+escapeHtml(cat)+'</div>'+
        '<div class="cnum" data-idx="'+idx+'">'+s.counts[idx]+'</div>'+
        '<button class="cbtn minus" data-minus="'+idx+'">−</button>'+
        '<button class="cbtn plus" data-plus="'+idx+'">+</button>';
      grid.appendChild(box);
    });
  }

  document.getElementById("countergrid").addEventListener("click",function(e){
    var plus=e.target.closest("[data-plus]");
    var minus=e.target.closest("[data-minus]");
    if(!plus && !minus) return;
    var s=getSession(activeTemplateId);
    var idx=plus?parseInt(plus.dataset.plus,10):parseInt(minus.dataset.minus,10);
    var delta=plus?1:-1;
    if(delta<0 && s.counts[idx]<=0) return;
    s.counts[idx]+=delta;
    s.rawLog.push({t:nowLabel(), idx:idx, delta:delta});
    saveSession(activeTemplateId,s);
    document.querySelector('#countergrid [data-idx="'+idx+'"]').textContent=s.counts[idx];
    renderTotal(s); renderFeed(s);
    tapFeedback();
  });

  document.getElementById("undobtn").addEventListener("click",function(){
    var s=getSession(activeTemplateId);
    if(s.rawLog.length===0) return;
    var last=s.rawLog.pop();
    s.counts[last.idx]-=last.delta;
    if(s.counts[last.idx]<0) s.counts[last.idx]=0;
    saveSession(activeTemplateId,s);
    var t=templates.find(function(x){return x.id===activeTemplateId;});
    renderCounterList(t,s); renderTotal(s); renderFeed(s);
    buzz(30);
  });

  document.getElementById("resetcounts").addEventListener("click",function(){
    askConfirm("Reset all counts for this interval? This cannot be undone.",function(){
      var t=templates.find(function(x){return x.id===activeTemplateId;});
      var s=getSession(activeTemplateId);
      s.counts=new Array(t.categories.length).fill(0);
      saveSession(activeTemplateId,s);
      renderCounterList(t,s); renderTotal(s);
    });
  });

  function renderFeed(s){
    var wrap=document.getElementById("feedwrap");
    var t=templates.find(function(x){return x.id===activeTemplateId;});
    var recent=s.rawLog.slice(-6).reverse();
    if(recent.length===0){ wrap.innerHTML='<div class="feeditem">No taps yet.</div>'; return; }
    wrap.innerHTML=recent.map(function(r){
      return '<div class="feeditem">'+(r.delta>0?"+1":"−1")+" "+escapeHtml(t.categories[r.idx])+" at "+r.t+"</div>";
    }).join("");
  }

  // ---------- location ----------
  function updateLocStatus(s){
    var el=document.getElementById("locstatus");
    el.textContent=s.location ? ("Location: "+s.location.lat+", "+s.location.lng) : "No location captured yet";
  }
  document.getElementById("captureloc").addEventListener("click",function(){
    var el=document.getElementById("locstatus");
    if(!navigator.geolocation){ el.textContent="Geolocation not supported in this browser."; return; }
    el.textContent="Requesting location…";
    navigator.geolocation.getCurrentPosition(function(pos){
      var s=getSession(activeTemplateId);
      s.location={lat:pos.coords.latitude.toFixed(5), lng:pos.coords.longitude.toFixed(5)};
      saveSession(activeTemplateId,s);
      updateLocStatus(s);
    },function(err){
      el.textContent="Unavailable in this preview ("+err.message+"). Will work once installed as an app.";
    },{timeout:6000});
  });

  document.getElementById("weathernotes").addEventListener("change",function(){
    var s=getSession(activeTemplateId);
    s.weather=this.value;
    saveSession(activeTemplateId,s);
  });

  // ---------- interval timer ----------
  function renderIntervalTimer(s){
    var m=Math.floor(s.intervalRemaining/60), sec=s.intervalRemaining%60;
    document.getElementById("intervaltimer").textContent=
      s.intervalLen===0 ? "--:--" : String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
  }

  document.getElementById("intervallen").addEventListener("change",function(){
    var s=getSession(activeTemplateId);
    s.intervalLen=parseInt(this.value,10);
    s.intervalRemaining=s.intervalLen;
    saveSession(activeTemplateId,s);
    renderIntervalTimer(s);
  });

  document.getElementById("intervalstart").addEventListener("click",function(){
    var s=getSession(activeTemplateId);
    if(s.intervalLen===0) return;
    if(intervalHandle){ clearInterval(intervalHandle); intervalHandle=null; s.intervalRunning=false; saveSession(activeTemplateId,s); this.textContent="Start interval"; return; }
    s.intervalRunning=true; saveSession(activeTemplateId,s);
    this.textContent="Pause interval";
    var self=this;
    intervalHandle=setInterval(function(){
      var cur=getSession(activeTemplateId);
      cur.intervalRemaining--;
      if(cur.intervalRemaining<=0){
        logInterval(cur);
        cur.intervalRemaining=cur.intervalLen;
      }
      saveSession(activeTemplateId,cur);
      renderIntervalTimer(cur);
    },1000);
  });

  function logInterval(s){
    var t=templates.find(function(x){return x.id===activeTemplateId;});
    s.intervalHistory.push({label:nowLabel(), counts:s.counts.slice()});
    s.counts=new Array(t.categories.length).fill(0);
    renderCounterList(t,s); renderTotal(s); renderHistory(s);
  }

  document.getElementById("intervallog").addEventListener("click",function(){
    var s=getSession(activeTemplateId);
    logInterval(s);
    saveSession(activeTemplateId,s);
  });

  function renderHistory(s){
    var wrap=document.getElementById("historywrap");
    var t=templates.find(function(x){return x.id===activeTemplateId;});
    if(!s.intervalHistory || s.intervalHistory.length===0){ wrap.innerHTML=""; return; }
    var html='<table class="historytable"><thead><tr><th>Time</th>';
    t.categories.forEach(function(c){ html+="<th>"+escapeHtml(c)+"</th>"; });
    html+="</tr></thead><tbody>";
    s.intervalHistory.forEach(function(h){
      html+="<tr><td>"+h.label+"</td>";
      h.counts.forEach(function(c){ html+="<td>"+c+"</td>"; });
      html+="</tr>";
    });
    html+="</tbody></table>";
    wrap.innerHTML=html;
  }

  // ---------- export ----------
  function download(filename,content){
    var blob=new Blob([content],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById("exportraw").addEventListener("click",function(){
    var t=templates.find(function(x){return x.id===activeTemplateId;});
    var s=getSession(activeTemplateId);
    var meta=["survey,"+t.name,"surveyor,"+(t.surveyorName||""),
      "location,"+(s.location?(s.location.lat+" "+s.location.lng):""),"weather,"+(s.weather||""),""];
    var rows=["time,counter,change"];
    s.rawLog.forEach(function(r){ rows.push(r.t+","+t.categories[r.idx]+","+(r.delta>0?"+1":"-1")); });
    download(t.name.replace(/\s+/g,"_")+"_raw_log.csv", meta.concat(rows).join("\n"));
  });

  document.getElementById("exportsummary").addEventListener("click",function(){
    var t=templates.find(function(x){return x.id===activeTemplateId;});
    var s=getSession(activeTemplateId);
    var meta=["survey,"+t.name,"surveyor,"+(t.surveyorName||""),
      "location,"+(s.location?(s.location.lat+" "+s.location.lng):""),"weather,"+(s.weather||""),""];
    var rows=["interval end time,"+t.categories.join(",")+",total"];
    s.intervalHistory.forEach(function(h){
      var total=h.counts.reduce(function(a,b){return a+b;},0);
      rows.push(h.label+","+h.counts.join(",")+","+total);
    });
    download(t.name.replace(/\s+/g,"_")+"_interval_summary.csv", meta.concat(rows).join("\n"));
  });

  // ---------- clock ----------
  function tickClock(){
    var zone=document.getElementById("zoneselect").value;
    localStorage.setItem(ZONE_KEY,zone);
    var opts={hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false};
    if(zone!=="local"){ opts.timeZone=zone; }
    document.getElementById("clock").textContent=new Intl.DateTimeFormat("en-GB",opts).format(new Date());
  }
  document.getElementById("zoneselect").addEventListener("change",tickClock);
  setInterval(tickClock,1000);

  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible" && !document.getElementById("view-counter").classList.contains("hidden")){
      requestWakeLock();
    }
  });

  renderPresetGrid();
  renderList();
  tickClock();
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function(e){
        console.log("Service worker registration failed:", e);
      });
    });
  }
</script>
</body>
</html>
